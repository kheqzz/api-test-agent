services:
  agent:
    build: .
    ports:
      - "8147:8147"
    environment:
      - PORT=8147
    env_file:
      - stack.env
    volumes:
      - ./generated_tests:/srv/generated_tests
    depends_on:
      - demo-api

  demo-api:
    build: .
    command: uvicorn app.demo_api.main:app --host 0.0.0.0 --port 8148
    ports:
      - "8148:8148"
